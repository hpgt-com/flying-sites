# Nettstedet på Cloudflare (Workers static assets): samme bygg som på GitHub Pages (_site), publisert av jobben
# «cloudflare» i .github/workflows/deploy.yml. Ingen kode kjører her, bare filer. flysteder.hpgt.com er et eget domene
# på denne Workeren, lagt til for hånd i Cloudflare (Workers & Pages → flysteder → Settings → Domains & Routes)
# 19.11.2026; publiseringer beholder det (docs/operations.md «Siden på Cloudflare»). Wrangler kommer fra workers/data
# (samme låste versjon).
name = "flysteder"
compatibility_date = "2026-09-30"
# Bare flysteder.hpgt.com: ingen kopi av nettstedet på flysteder.hpgt.workers.dev eller på adresser for forhåndsvisning.
workers_dev = false
preview_urls = false

[assets]
directory = "../../_site"
# 404.html for en adresse som ikke finnes, som på GitHub Pages; /om gir /om/ slik GitHub Pages gjør.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Slått på i dashbordet 19.11.2026; står her så en publisering beholder det. Filene serveres uten at noen kode
# kjører, så det er lite å logge: mest målingene (forespørsler, feil, båndbredde). Gratisplan: loggingen tar pause
# resten av dagen ved dagsgrensen og koster aldri noe.
# Cloudflares logg per kall er av: den ville logget hvert sidebesøk med IP-adressen og nettleseren. Workeren har ingen
# egen kode, så det er ingenting annet å logge.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
