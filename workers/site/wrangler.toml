# The site on Cloudflare (Workers static assets): the same build as GitHub Pages (_site), published by the job
# «cloudflare» in .github/workflows/deploy.yml. No code runs here, only files. While GitHub Pages still serves
# flysteder.hpgt.com, this answers at https://flysteder.hpgt.workers.dev for testing; the custom domain
# flysteder.hpgt.com is added by hand in Cloudflare when the DNS record that points to GitHub is removed
# (docs/operations.md «The site on Cloudflare»). Wrangler comes from workers/data (the same pinned version).
name = "flysteder"
compatibility_date = "2026-09-30"
workers_dev = true

[assets]
directory = "../../_site"
# 404.html for an address that does not exist, as on GitHub Pages; /om serves /om/ like GitHub Pages does.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
