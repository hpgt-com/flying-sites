# The site on Cloudflare (Workers static assets): the same build as GitHub Pages (_site), published by the job
# «cloudflare» in .github/workflows/deploy.yml. No code runs here, only files. flysteder.hpgt.com is a custom domain
# on this Worker, added by hand in Cloudflare (Workers & Pages → flysteder → Settings → Domains & Routes) on
# 19.11.2026; deploys keep it (docs/operations.md «The site on Cloudflare»). Wrangler comes from workers/data (the same
# pinned version).
name = "flysteder"
compatibility_date = "2026-09-30"
# Only flysteder.hpgt.com: no copy of the site at flysteder.hpgt.workers.dev or at preview addresses.
workers_dev = false
preview_urls = false

[assets]
directory = "../../_site"
# 404.html for an address that does not exist, as on GitHub Pages; /om serves /om/ like GitHub Pages does.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Turned on in the dashboard on 19.11.2026; kept here so a deploy keeps it. The site's files are served without
# running any code, so there is little to log: mostly the metrics (requests, errors, bandwidth). Free plan: logging
# pauses for the day at the daily limit and is never charged.
[observability]
enabled = true
