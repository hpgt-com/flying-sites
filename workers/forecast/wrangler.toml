# The weather service (src/index.js). Deployed from main by .github/workflows/forecast-worker.yml, with the token and
# account in the GitHub environment «cloudflare». The KV namespace is created by Wrangler on the first deploy (no id here).
name = "forecast"
main = "src/index.js"
compatibility_date = "2026-09-30"
workers_dev = true

[[kv_namespaces]]
binding = "FORECAST"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
