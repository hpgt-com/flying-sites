name: Oppdater kraftlinjer og hindringer

# Henter kraftlinjene og andre hindre i området rundt stedene én gang i måneden, til kartlaget
# «Kraftlinjer og hindre» (scripts/update-obstacles.mjs): NVEs kraftlinjer, master og vindturbiner, og fra
# OpenStreetMap lavspentlinjene, taubanene og mastene, lagret som fliser med en indeks. Endringer kommer som en PR,
# så noen ser over diffen før publisering. Uten endringer skjer ingenting. Trenger ingen hemmeligheter. PR-en lages
# med klubbens GitHub-app, som i airspace.yml (repo-variabelen APP_CLIENT_ID og hemmeligheten APP_PRIVATE_KEY).
#
# To jobber, så kode fra tredjeparter aldri kjører med skrivetilgang:
#   fetch  installerer npm-pakkene og kjører skriptet, med bare lesetilgang. Resultatet sendes videre som en artefakt.
#   pr     har skrivetilgang for å pushe grenen og åpne PR-en, men installerer og kjører ingenting fra npm.

on:
  schedule:
    - cron: "17 6 2 * *" # den 2. hver måned kl. 06:17 UTC (dagen etter luftrommet)
  workflow_dispatch:

# Ingen tilgang som standard. Hver jobb ber om det den trenger.
permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      - name: Hent kraftlinjer og hindre
        # shell: bash slår på pipefail, så en feil i skriptet stopper jobben selv om utdataene går gjennom tee.
        shell: bash
        run: npm run --silent obstacles | tee hindre.txt

      - name: Sjekk om noe er endret
        id: diff
        # Datoen i indeksen endres hver gang, så bare flisene (lagt til, endret eller fjernet) og resten av
        # indeksen regnes som en endring.
        run: |
          dir=src/_data/cache/obstacles
          if [ -z "$(git status --porcelain -- "$dir" ":(exclude)$dir/index.json")" ] &&
             [ "$(git show "HEAD:$dir/index.json" 2>/dev/null | jq -c 'del(.fetched)')" = "$(jq -c 'del(.fetched)' "$dir/index.json")" ]; then
            echo "Ingen endringer i kraftlinjer og hindre."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obstacles
          path: |
            src/_data/cache/obstacles
            hindre.txt
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # APP_PRIVATE_KEY ligger i miljøet «automation», som bare main kan bruke (se airspace.yml).
    environment: automation
    permissions:
      contents: read
    steps:
      # Kortlivet token fra klubbens GitHub-app, begrenset til dette repoet og de to tillatelsene jobben
      # trenger. Det trekkes tilbake når jobben er ferdig. Jobben feiler hvis appen ikke er satt opp.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Tokenet beholdes fordi jobben pusher en gren for PR-en. Den laster ikke opp artefakter og kjører ingen npm-kode.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app.outputs.token }}

      - run: rm -rf src/_data/cache/obstacles

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obstacles
          path: .

      - name: Lag PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="obstacles/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A src/_data/cache/obstacles
          git commit -m "Oppdater kraftlinjer og hindre fra NVE og OpenStreetMap"
          git push -u origin "$branch"
          {
            echo "Automatisk henting av kraftlinjer og hindre rundt flystedene, fra NVE og OpenStreetMap. Se over tallene, og slå på laget «Kraftlinjer og hindre» i forhåndsvisningen ved tvil, før du merger."
            echo
            echo '~~~'
            cat hindre.txt
            echo '~~~'
          } > pr.md
          gh pr create --title "Kraftlinjer og hindre $(date +%d.%m.%Y)" --body-file pr.md

  # En sak når kjøringen feiler (en kommentar på den åpne hvis den feiler igjen), så en feilet kjøring ikke blir
  # oversett: GitHub sier ikke fra selv om planlagte kjøringer, og de kan også komme timer for sent. Kjører ingen
  # kode fra prosjektet.
  alert:
    needs: [fetch, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi
