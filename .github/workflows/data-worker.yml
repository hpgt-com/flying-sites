name: Data service

# Publishes the data service (workers/data) to Cloudflare Workers when it, the MET code or the sites change on main.
# The service fetches its data by itself (a Cron Trigger every minute, each source on its own interval), so this only runs on changes.
# After publishing it waits until the new version has run successfully, and rolls back to the one before if not.
on:
  push:
    branches: [main]
    paths:
      - "workers/data/**"
      - "lib/weather/met.js"
      - "lib/weather/open-meteo.js"
      - "lib/windgram.js"
      - "lib/site-files.js"
      - "scripts/data-sites.mjs"
      - "scripts/data-smoke.mjs"
      - "src/sites/*/index.md"
      - ".github/workflows/data-worker.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The token and account are secrets in the environment «cloudflare», which only main may use. The token may only
    # publish Workers in the HPGT account (see SECURITY.md).
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache here: a job that publishes should not restore files another run could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The launches from the site files (js-yaml from the root packages). --ignore-scripts as in the other workflows.
      - run: npm ci --ignore-scripts
      - run: node scripts/data-sites.mjs

      # The tests once more before publishing: the PR check ran them, but a merge of two PRs is a new combination.
      - run: npm test

      # Wrangler, at the version in workers/data/package-lock.json.
      - run: npm ci --ignore-scripts
        working-directory: workers/data

      # The version that runs now, to roll back to if the new one does not work.
      - name: Versjonen som kjører nå
        id: before
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Unknown (empty) if the answer cannot be read; the rollback then goes to the version before the new one.
          npx wrangler deployments status --json > before.json || true
          version=$(node -e 'try { const d = JSON.parse(require("fs").readFileSync("before.json", "utf8")); const v = (d.versions ?? []).slice().sort((a, b) => b.percentage - a.percentage)[0]; process.stdout.write(/^[0-9a-f-]{36}$/.test(v?.version_id ?? "") ? v.version_id : ""); } catch {}')
          echo "Kjører nå: ${version:-ukjent}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publiser
        id: deploy
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Waits until the new version has run a source successfully and serves a dataset (scripts/data-smoke.mjs).
      - name: Sjekk den nye versjonen
        id: smoke
        env:
          PUBLISHED_AT: ${{ steps.deploy.outputs.at }}
        run: node scripts/data-smoke.mjs "$PUBLISHED_AT"

      # If it does not, the version from before runs again, and the run fails (the alert job opens an issue). A store
      # rebuilt by the new version keeps its tables: the old code reads them as they are.
      - name: Rull tilbake
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.before.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$VERSION" ]; then
            npx wrangler rollback "$VERSION" --message "Sjekken etter publisering feilet: $RUN_URL" --yes
          else
            npx wrangler rollback --message "Sjekken etter publisering feilet: $RUN_URL" --yes
          fi

  # An issue when the run fails (a comment on the open one if it fails again), so a failing run is not missed: GitHub
  # sends no notice of its own for scheduled runs, and they may also be late by hours. Runs no project code.
  alert:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi
