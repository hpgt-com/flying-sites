name: Datatjenesten

# Publiserer datatjenesten (workers/data) til Cloudflare Workers når den, MET-koden eller stedene endres på main.
# Tjenesten henter dataene selv (en Cron Trigger hvert minutt, hver kilde med sitt eget intervall), så denne kjører
# bare ved endringer.
# Etter publisering venter den til den nye versjonen har kjørt uten feil, og ruller ellers tilbake til den forrige.
on:
  push:
    branches: [main]
    paths:
      - "workers/data/**"
      - "lib/weather/met.js"
      - "lib/weather/open-meteo.js"
      - "lib/windgram.js"
      - "lib/site-files.js"
      - "scripts/data-sites.mjs"
      - "scripts/data-smoke.mjs"
      - "src/sites/*/index.md"
      - ".github/workflows/data-worker.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tokenet og kontoen er hemmeligheter i miljøet «cloudflare», som bare main kan bruke. Tokenet kan bare
    # publisere Workers i HPGT-kontoen (se SECURITY.md).
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ingen npm-buffer her: en jobb som publiserer, skal ikke hente fram filer en annen kjøring kan ha skrevet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Startene fra stedsfilene (js-yaml fra pakkene i roten). --ignore-scripts som i de andre arbeidsflytene.
      - run: npm ci --ignore-scripts
      - run: node scripts/data-sites.mjs

      # Testene én gang til før publisering: PR-sjekken kjørte dem, men en merge av to PR-er er en ny kombinasjon.
      - run: npm test

      # Wrangler, i versjonen i workers/data/package-lock.json.
      - run: npm ci --ignore-scripts
        working-directory: workers/data

      # Versjonen som kjører nå, å rulle tilbake til hvis den nye ikke virker.
      - name: Versjonen som kjører nå
        id: before
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Ukjent (tom) hvis svaret ikke kan leses; da ruller den tilbake til versjonen før den nye.
          npx wrangler deployments status --json > before.json || true
          version=$(node -e 'try { const d = JSON.parse(require("fs").readFileSync("before.json", "utf8")); const v = (d.versions ?? []).slice().sort((a, b) => b.percentage - a.percentage)[0]; process.stdout.write(/^[0-9a-f-]{36}$/.test(v?.version_id ?? "") ? v.version_id : ""); } catch {}')
          echo "Kjører nå: ${version:-ukjent}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publiser
        id: deploy
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Venter til den nye versjonen har kjørt en kilde uten feil og serverer et datasett (scripts/data-smoke.mjs).
      - name: Sjekk den nye versjonen
        id: smoke
        env:
          PUBLISHED_AT: ${{ steps.deploy.outputs.at }}
        run: node scripts/data-smoke.mjs "$PUBLISHED_AT"

      # Gjør den ikke det, kjører versjonen fra før igjen, og kjøringen feiler (jobben alert åpner en sak). Et lager
      # som den nye versjonen har bygget om, beholder tabellene: den gamle koden leser dem som de er.
      - name: Rull tilbake
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.before.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$VERSION" ]; then
            npx wrangler rollback "$VERSION" --message "Sjekken etter publisering feilet: $RUN_URL" --yes
          else
            npx wrangler rollback --message "Sjekken etter publisering feilet: $RUN_URL" --yes
          fi

  # En sak når kjøringen feiler (en kommentar på den åpne hvis den feiler igjen), så en feilet kjøring ikke blir
  # oversett: GitHub sier ikke fra selv om planlagte kjøringer, og de kan også komme timer for sent. Kjører ingen
  # kode fra prosjektet.
  alert:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi
