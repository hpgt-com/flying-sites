name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Build twice an hour, so the front-page wind assessment has a fresh MET forecast (the weather job).
  # GitHub does not guarantee scheduled runs: they can be delayed for hours or skipped under heavy load,
  # especially around the top of the hour. Hence the odd minutes, and the forecast is accepted until it is 6 hours old
  # (maxForecastAgeHours in src/_data/windRules.json).
  # GitHub disables scheduled runs after 60 days without repository activity.
  schedule:
    - cron: "17,47 * * * *"

# Four jobs:
#   weather  fetches the MET wind forecast and the Open-Meteo winds aloft (lib/weather/, npm run weather) and hands
#            them on as an artifact. Read-only, no secrets. A source that fails is written as null, so the job does
#            not stop publishing.
#   build    builds the site with the fetched weather and never queries MET or Open-Meteo itself (WEATHER_FETCH=0).
#   deploy   publishes. Only this job has publishing permissions (pages, id-token), and it runs no code from the repo.
#   attest   signs build provenance and the SBOM for the published archive (see the job below).
# When the weather moves to a backend, the weather job and the schedule below can go.
# Actions are pinned to commit SHAs (Dependabot updates them).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Timeout on every job (timeout-minutes): if a GitHub runner hangs, the job stops by itself
# instead of blocking for up to 6 hours.
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      - run: npm run weather

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather
          path: .cache/weather
          # .cache starts with a dot, and hidden folders are left out by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: weather
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so «Sist endret» per site can be read from Git.
          fetch-depth: 0
          # The token is not needed after checkout and must not stay in .git while the site is built and uploaded.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      # Provides the path the site is published under: "/flying-sites" on hpgt-com.github.io, empty with a custom domain.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The image variants (lib/images.js) take most of the build time. eleventy-img skips a variant whose file already
      # exists (the file name holds a hash of the source image and the options), so the folder is kept between builds.
      # The key changes when an image, the image code or a package changes, and then every variant is made again:
      # there are no restore-keys, so variants of removed images are never carried over and published.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: site-img-${{ hashFiles('src/sites/**/*.jpg', 'lib/images.js', 'lib/photo-credit.js', 'lib/site-images.js', 'package-lock.json') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weather
          path: .cache/weather

      # Fails if a site file is invalid. The weather comes from the weather job only (WEATHER_FETCH=0).
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          WEATHER_FETCH: "0"

      # Stops the deploy if a page has «[object Object]», «undefined», «NaN» or an unfilled placeholder
      # (lib/output-check.js), so a slip from a merge never goes live.
      - run: npm run check:output

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # /.well-known/security.txt starts with a dot, and hidden files are left out by default.
          # The build writes no other hidden files (.git and .github are always left out).
          include-hidden-files: true

      # The SHA-256 of the archive upload-pages-artifact just made ($RUNNER_TEMP/artifact.tar), which is the exact
      # file deploy-pages publishes. The attest job signs this digest.
      - id: digest
        run: echo "digest=sha256:$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # SBOM (SPDX 2.3) of every npm package the build used, from package-lock.json, with npm's own command
      # (no third-party action).
      - run: npm sbom --sbom-format spdx --package-lock-only > sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  # Signs what was published: build provenance (which workflow, commit and run built the site) and the SBOM, both
  # tied to the digest of the Pages archive. A separate job, so the build job never gets id-token. It checks out
  # no code and runs nothing from the repo. Deploy does not wait for it, so a failed attestation never stops
  # publishing. Verify with `gh attestation verify`, see SECURITY.md.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # stores the attestation on the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: github-pages.tar
          subject-digest: ${{ needs.build.outputs.digest }}

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: github-pages.tar
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.spdx.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
