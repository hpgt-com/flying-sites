name: Bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:
# Ingen tidsplan: siden bygges bare når innholdet endres. Sidene henter varselet, høydevinden og stasjonene fra
# datatjenesten (workers/data) når den har nyere data enn det som er bygget inn, så de holder seg ferske mellom
# byggene.

# Seks jobber:
#   weather  henter vindvarselet fra MET og høydevinden fra Open-Meteo (lib/weather/, npm run weather) og sender dem
#            videre som en artefakt, så hvert bygg starter fra et ferskt varsel (sidene bruker så datatjenestens når
#            det er nyere). Bare lesetilgang, ingen hemmeligheter. En kilde som feiler, skrives som null, så jobben
#            ikke stopper publiseringen.
#   build    bygger siden med det hentede været og spør aldri MET eller Open-Meteo selv (WEATHER_FETCH=0).
#   deploy   publiserer. Bare denne jobben har rettigheter til å publisere (pages, id-token), og den kjører ingen kode
#            fra repoet.
#   cloudflare publiserer det samme arkivet til Cloudflare (workers/site), med sitt eget token. Hoppes over så lenge
#            tokenet ikke er satt; se docs/operations.md «Siden på Cloudflare».
#   attest   signerer byggeproveniens og SBOM for det publiserte arkivet (se jobben nedenfor).
#   alert    åpner en sak når kjøringen feiler, eller kommenterer på den åpne.
# Actions er låst til commit-SHA-er (Dependabot oppdaterer dem).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Tidsgrense på hver jobb (timeout-minutes): henger en runner hos GitHub, stopper jobben av seg selv
# i stedet for å blokkere i opptil 6 timer.
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      - run: npm run weather

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather
          path: .cache/weather
          # .cache begynner med punktum, og skjulte mapper utelates som standard.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: weather
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      pages: read # configure-pages leser Pages-innstillingene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hele historikken, så «Sist endret» per sted kan leses fra Git.
          fetch-depth: 0
          # Tokenet trengs ikke etter checkout og skal ikke bli liggende i .git mens siden bygges og lastes opp.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      # Gir stien siden publiseres under: "/flying-sites" på hpgt-com.github.io, tom med eget domene.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Bildevariantene (lib/images.js) tar mesteparten av byggetiden. eleventy-img hopper over en variant når filen
      # allerede finnes (filnavnet har en hash av kildebildet og valgene), så mappen beholdes mellom byggene.
      # Nøkkelen endres når et bilde, bildekoden eller en pakke endres, og da lages alle variantene på nytt:
      # det er ingen restore-keys, så varianter av fjernede bilder blir aldri tatt med videre og publisert.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: site-img-${{ hashFiles('src/sites/**/*.jpg', 'lib/images.js', 'lib/photo-credit.js', 'lib/site-images.js', 'package-lock.json') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weather
          path: .cache/weather

      # Feiler hvis en stedsfil er ugyldig. Været kommer bare fra jobben weather (WEATHER_FETCH=0).
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          WEATHER_FETCH: "0"

      # Stopper publiseringen hvis en side har «[object Object]», «undefined», «NaN» eller en plassholder som ikke er
      # fylt ut (lib/output-check.js), så en glipp fra en merge aldri blir publisert.
      - run: npm run check:output

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # /.well-known/security.txt begynner med punktum, og skjulte filer utelates som standard.
          # Bygget skriver ingen andre skjulte filer (.git og .github utelates alltid).
          include-hidden-files: true

      # SHA-256 av arkivet upload-pages-artifact nettopp laget ($RUNNER_TEMP/artifact.tar), som er nøyaktig den
      # filen deploy-pages publiserer. Jobben attest signerer denne digesten.
      - id: digest
        run: echo "digest=sha256:$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # SBOM (SPDX 2.3) av alle npm-pakkene bygget brukte, fra package-lock.json, med npms egen kommando
      # (ingen action fra tredjeparter).
      - run: npm sbom --sbom-format spdx --package-lock-only > sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  # Signerer det som ble publisert: byggeproveniens (hvilken arbeidsflyt, commit og kjøring som bygget siden) og SBOM,
  # begge knyttet til digesten av Pages-arkivet. En egen jobb, så byggejobben aldri får id-token. Den sjekker ikke ut
  # kode og kjører ingenting fra repoet. Deploy venter ikke på den, så en attestasjon som feiler, stopper aldri
  # publiseringen. Verifiser med `gh attestation verify`, se SECURITY.md.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore-sertifikatet som signerer attestasjonen
      attestations: write # lagrer attestasjonen på repoet
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: github-pages.tar
          subject-digest: ${{ needs.build.outputs.digest }}

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: github-pages.tar
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.spdx.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # De samme filene på Cloudflare (Workers static assets, workers/site/wrangler.toml), fra arkivet bygget laget for
  # GitHub Pages, så begge serverer nøyaktig det samme bygget. Tokenet (CLOUDFLARE_SITE_TOKEN i miljøet «cloudflare»,
  # bare main) kan bare publisere Workers i HPGT-kontoen; uten det gjør jobben ingenting.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ingen npm-buffer her: en jobb som publiserer, skal ikke hente fram filer en annen kjøring kan ha skrevet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Wrangler, i versjonen i workers/data/package-lock.json.
      - run: npm ci --ignore-scripts
        working-directory: workers/data

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - run: mkdir -p _site && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C _site

      - name: Publiser til Cloudflare
        working-directory: workers/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_SITE_TOKEN er ikke satt i miljøet «cloudflare», så siden publiseres bare til GitHub Pages."
            exit 0
          fi
          npx wrangler deploy --config ../site/wrangler.toml

  # En sak når kjøringen feiler (en kommentar på den åpne hvis den feiler igjen), så en feilet kjøring ikke blir
  # oversett: GitHub sier ikke fra selv om planlagte kjøringer, og de kan også komme timer for sent. Kjører ingen
  # kode fra prosjektet.
  alert:
    needs: [weather, build, attest, deploy, cloudflare]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi
