name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bygg hver time, så vindvurderingen på forsiden har ferskt varsel fra MET.
  # GitHub slår av planlagte kjøringer etter 60 dager uten aktivitet i repoet.
  schedule:
    - cron: "5 * * * *"

# Byggejobben (build) får bare lese. Rettighetene til å publisere (pages, id-token) har bare deploy-jobben,
# som ikke kjører kode fra repoet. Actions er låst til commit-SHA (Dependabot oppdaterer dem).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages leser innstillingene for Pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full historikk, så «Sist endret» per sted kan hentes fra Git.
          fetch-depth: 0
          # Tokenet trengs ikke etter checkout, og skal ikke ligge i .git når siden bygges og lastes opp.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gir stien siden publiseres under: "/flying-sites" på hpgt-com.github.io, tom med eget domene.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Feiler hvis en stedsfil er ugyldig.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
