name: Oppdater luftrom

# Henter luftrom fra openAIP for alle stedene én gang i måneden (AIRAC-syklusen er 28 dager).
# Endringer kommer som en PR, så noen ser over diffen før publisering. Hver vellykket kjøring oppdaterer også
# checked.json (datoen for sjekken), så det kommer en PR hver måned; når den merges, er det notert at sjekken er gjort.
# Krever repo-hemmeligheten OPENAIP_API_KEY.
#
# PR-en lages med et token fra klubbens GitHub-app (repo-variabelen APP_CLIENT_ID og hemmeligheten
# APP_PRIVATE_KEY, se docs/operations.md), så PR-sjekken kjører på den som på alle andre PR-er. GITHUB_TOKEN kan
# ikke lage pull requests i denne organisasjonen, så jobben feiler hvis appen ikke er satt opp.
#
# To jobber, så kode fra tredjeparter aldri kjører med skrivetilgang:
#   fetch  installerer npm-pakkene og kjører skriptet, med bare lesetilgang og openAIP-nøkkelen.
#          Resultatet sendes videre som en artefakt.
#   pr     har skrivetilgang for å pushe grenen og åpne PR-en, men installerer og kjører ingenting fra npm.
#          Den kopierer bare de hentede filene på plass og committer dem.
#
# «Run workflow» har valget «Test bare tokenet fra GitHub-appen». Det kjører bare jobben test-app-token, som får
# et token med bare lesetilgang fra appen og leser repoet, for å sjekke at appen er riktig satt opp. Den henter
# ikke luftrom, pusher ingenting og åpner ingen PR.

on:
  schedule:
    - cron: "0 6 1 * *" # den 1. hver måned kl. 06:00 UTC
  workflow_dispatch:
    inputs:
      test_app_token:
        description: "Test bare tokenet fra GitHub-appen (henter ikke luftrom, lager ingen PR)"
        type: boolean
        default: false

# Ingen tilgang som standard. Hver jobb ber om det den trenger.
permissions: {}

# Tidsgrense på hver jobb (timeout-minutes): henger en runner hos GitHub, stopper jobben av seg selv
# i stedet for å blokkere i opptil 6 timer.
jobs:
  fetch:
    # Hoppes over når bare app-tokenet testes. Den månedlige kjøringen har ingen inndata, så da kjører den alltid.
    if: ${{ !inputs.test_app_token }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hemmelighetene (OPENAIP_API_KEY her, APP_PRIVATE_KEY i pr og test-app-token) ligger i miljøet
    # «automation», som bare main kan bruke, så en arbeidsflyt som er endret på en annen gren, ikke kan lese dem.
    environment: automation
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      - name: Hent luftrom fra openAIP
        # shell: bash slår på pipefail, så en feil i skriptet stopper jobben selv om utdataene går gjennom tee.
        shell: bash
        run: npm run --silent airspace | tee luftrom.txt
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}

      - name: Sjekk om noe er endret
        id: diff
        run: |
          if [ -z "$(git status --porcelain src/_data/cache/airspace)" ]; then
            echo "Ingen endringer i luftrom."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Hele cache-mappen (så filer skriptet har fjernet, forblir fjernet) og utdataene fra skriptet til PR-teksten.
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airspace
          path: |
            src/_data/cache/airspace
            luftrom.txt
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
    steps:
      # Kortlivet token fra klubbens GitHub-app, begrenset til dette repoet og de to tillatelsene jobben
      # trenger. Det trekkes tilbake når jobben er ferdig. Jobben feiler hvis appen ikke er satt opp.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Tokenet beholdes fordi jobben pusher en gren for PR-en. Den laster ikke opp artefakter og kjører ingen npm-kode.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app.outputs.token }}

      # Erstatter cache-mappen med den hentede, så fjernede filer fjernes her også.
      - run: rm -rf src/_data/cache/airspace

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airspace
          path: .

      - name: Lag PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="airspace/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A src/_data/cache/airspace
          git commit -m "Oppdater luftrom fra openAIP"
          git push -u origin "$branch"
          {
            echo "Automatisk henting av luftrom fra openAIP. Se over diffen, og sammenlign med IPPC ved tvil, før du merger."
            echo
            echo '~~~'
            grep -E "ENDRET|\(ny\)" -A 20 luftrom.txt | grep -v "^--$" || echo "Ingen endringer i luftrommet. Bare kontrolldatoen (checked.json) er oppdatert." 
            echo '~~~'
          } > pr.md
          gh pr create --title "Luftrom fra openAIP $(date +%d.%m.%Y)" --body-file pr.md

  # En sak når kjøringen feiler (en kommentar på den åpne hvis den feiler igjen), så en feilet kjøring ikke blir
  # oversett: GitHub sier ikke fra selv om planlagte kjøringer, og de kan også komme timer for sent. Kjører ingen
  # kode fra prosjektet.
  alert:
    needs: [fetch, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi

  # Sjekker at GitHub-appen er satt opp: APP_CLIENT_ID, APP_PRIVATE_KEY og installasjonen på dette repoet.
  test-app-token:
    if: ${{ inputs.test_app_token }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automation
    permissions: {}
    steps:
      - name: Sjekk at APP_CLIENT_ID er satt
        if: vars.APP_CLIENT_ID == ''
        run: |
          echo "::error::Variabelen APP_CLIENT_ID mangler (Settings → Secrets and variables → Actions → Variables)."
          exit 1

      # Token med bare lesetilgang: testen leser bare, selv om appen kan skrive.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Les repoet med app-tokenet
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          name=$(gh api "repos/$REPO" --jq .full_name)
          echo "Appen $APP_SLUG[bot] fikk token og kunne lese $name."
          echo "### App-tokenet fungerer" >> "$GITHUB_STEP_SUMMARY"
          echo "Appen \`$APP_SLUG[bot]\` fikk et token og kunne lese \`$name\`. Luftroms-PR-ene lages med appen." >> "$GITHUB_STEP_SUMMARY"
