name: Update airspace

# Fetches airspace from openAIP for all sites once a month (the AIRAC cycle is 28 days).
# Changes arrive as a PR, so someone reviews the diff before publishing. Without changes nothing happens.
# Requires the repository secret OPENAIP_API_KEY.
#
# The PR is created with a GitHub App token when the app is set up (repository variable APP_CLIENT_ID
# and secret APP_PRIVATE_KEY, see docs/operations.md). The PR check then runs on the PR like on any
# other, and it can be merged without «Bypass rules». Without the app, the workflow falls back to GITHUB_TOKEN:
# that needs «Allow GitHub Actions to create and approve pull requests» under Settings → Actions → General, and
# PRs created with GITHUB_TOKEN do not trigger the PR check.
#
# Two jobs, so third-party code never runs with write access:
#   fetch  installs the npm packages and runs the script, with read-only access and the openAIP key.
#          The result is handed on as an artifact.
#   pr     has write access to push the branch and open the PR, but installs and runs nothing from npm.
#          It only copies the fetched files into place and commits them.
#
# «Run workflow» has the option «Test the GitHub App token only». It runs just the test-app-token job, which gets
# a read-only token from the app and reads the repository, to check that the app is set up correctly. It fetches
# no airspace, pushes nothing and opens no PR.

on:
  schedule:
    - cron: "0 6 1 * *" # the 1st of every month at 06:00 UTC
  workflow_dispatch:
    inputs:
      test_app_token:
        description: "Test the GitHub App token only (no airspace fetch, no PR)"
        type: boolean
        default: false

# No access by default. Each job asks for what it needs.
permissions: {}

# Timeout on every job (timeout-minutes): if a GitHub runner hangs, the job stops by itself
# instead of blocking for up to 6 hours.
jobs:
  fetch:
    # Skipped when only testing the app token. On the monthly schedule there are no inputs, so it always runs.
    if: ${{ !inputs.test_app_token }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The secrets (OPENAIP_API_KEY here, APP_PRIVATE_KEY in pr and test-app-token) live in the environment
    # «automation», which only main may use, so a workflow changed on another branch cannot read them.
    environment: automation
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      - name: Hent luftrom fra openAIP
        # shell: bash enables pipefail, so a script error stops the job even though output goes through tee.
        shell: bash
        run: npm run --silent airspace | tee luftrom.txt
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}

      - name: Sjekk om noe er endret
        id: diff
        run: |
          if [ -z "$(git status --porcelain src/_data/cache/airspace)" ]; then
            echo "Ingen endringer i luftrom."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The whole cache folder (so files removed by the script stay removed) and the script's output for the PR text.
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airspace
          path: |
            src/_data/cache/airspace
            luftrom.txt
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Short-lived token from the club's GitHub App, limited to this repository and to the two permissions the
      # job needs. It is revoked when the job ends. Skipped when the app is not set up.
      - id: app
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The token is kept because the job pushes a branch for the PR. It uploads no artifacts and runs no npm code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      # Replaces the cache folder with the fetched one, so removed files are removed here too.
      - run: rm -rf src/_data/cache/airspace

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airspace
          path: .

      - name: Lag PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          branch="airspace/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A src/_data/cache/airspace
          git commit -m "Oppdater luftrom fra openAIP"
          git push -u origin "$branch"
          {
            echo "Automatisk henting av luftrom fra openAIP. Se over diffen, og sammenlign med IPPC ved tvil, før du merger."
            echo
            echo '~~~'
            grep -E "ENDRET|\(ny\)" -A 20 luftrom.txt | grep -v "^--$" || true
            echo '~~~'
          } > pr.md
          gh pr create --title "Luftrom fra openAIP $(date +%d.%m.%Y)" --body-file pr.md

  # An issue when the run fails (a comment on the open one if it fails again), so a failing run is not missed: GitHub
  # sends no notice of its own for scheduled runs, and they may also be late by hours. Runs no project code.
  alert:
    needs: [fetch, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Meld feilen som issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Jobben «$WORKFLOW» feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Feilet igjen: $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "Kjøringen feilet: $RUN_URL

          Se loggen, rett feilen og kjør jobben på nytt (Actions → «$WORKFLOW» → «Run workflow»). Lukk saken når den går grønt."
          fi

  # Checks that the GitHub App is set up: APP_CLIENT_ID, APP_PRIVATE_KEY and the installation on this repository.
  test-app-token:
    if: ${{ inputs.test_app_token }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automation
    permissions: {}
    steps:
      - name: Sjekk at APP_CLIENT_ID er satt
        if: vars.APP_CLIENT_ID == ''
        run: |
          echo "::error::Variabelen APP_CLIENT_ID mangler (Settings → Secrets and variables → Actions → Variables)."
          exit 1

      # Read-only token: the test only reads, even though the app may write.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Les repoet med app-tokenet
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          name=$(gh api "repos/$REPO" --jq .full_name)
          echo "Appen $APP_SLUG[bot] fikk token og kunne lese $name."
          echo "### App-tokenet fungerer" >> "$GITHUB_STEP_SUMMARY"
          echo "Appen \`$APP_SLUG[bot]\` fikk et token og kunne lese \`$name\`. Luftroms-PR-ene lages med appen." >> "$GITHUB_STEP_SUMMARY"
