name: Kodeskanning

# Statisk analyse (foreløpig CodeQL) av JavaScript-koden (nettstedet og byggeskriptene) og arbeidsflytene. Funnene
# vises under Security → Code scanning. Kjører på PR-er, på main og én gang i uka, så nye regler også fanger
# gammel kode. Gratis for offentlige repoer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # mandager kl. 04:17 UTC

permissions:
  contents: read

# En ny push til samme gren avbryter kjøringen for den forrige (på main fullføres kjøringene, så hver commit blir
# analysert).
concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Tidsgrense på hver jobb (timeout-minutes): henger en runner hos GitHub, stopper jobben av seg selv
# i stedet for å blokkere i opptil 6 timer.
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # laster opp funnene
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
