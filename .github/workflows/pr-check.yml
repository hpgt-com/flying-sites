name: PR check

# Builds the site for every PR against main, so an invalid site file or a template error is caught before
# it reaches main and breaks publishing. Publishes nothing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run for the previous one: only the newest commit matters.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

# Timeout on every job (timeout-minutes): if a GitHub runner hangs, the job stops by itself
# instead of blocking for up to 6 hours.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      - run: npm test

      # ESLint, the recommended rules only (eslint.config.js): an undefined name or an unused variable the tests do not reach.
      - run: npm run lint

      # Image variants from the deploy build on main (same key as in deploy.yml), so the PR build is quicker.
      # Only restored, never saved, so a PR cannot change what main uses.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: site-img-${{ hashFiles('src/sites/**/*.jpg', 'lib/images.js', 'lib/photo-credit.js', 'lib/site-images.js', 'package-lock.json') }}

      # Site file validation happens during the build. The wind forecast is skipped, so PRs do not query MET.
      - run: npm run build
        env:
          FORECAST_OFFLINE: "1"

      # Every internal link and image points to a file that exists (lib/link-check.js). No network.
      - run: npm run check:links

      # HTML validation of every page (.htmlvalidate.mjs lists the rules turned off, and why).
      - run: npm run check:html

      # No «[object Object]», «undefined», «NaN» or unfilled placeholders in the pages (lib/output-check.js).
      - run: npm run check:output

      # The built pages for the accessibility check, without the image variants (large, and not needed for the check).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            _site
            !_site/img
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # axe-core in Chromium on a few pages that cover the templates, in light and dark mode (scripts/check-a11y.mjs).
  # Fails on findings with impact serious or critical. Then the behaviour check in the same browser (below).
  accessibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      # The Chromium that matches the Playwright version in package-lock.json, kept between runs (about 300 MB, and the
      # download with its apt step has taken the runner up to ten minutes). On a miss it is installed with the system
      # libraries it needs; on a hit the runner image already has them (it ships Chrome).
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - run: npm run check:a11y

      # What the pages do in the browser (scripts/check-behaviour.mjs): map markers on zoom, «Piloter i lufta», the data
      # service down, «Meld fra», offline. No network: the script answers the data service and Turnstile.
      - run: npm run check:behaviour

  # Blocks PRs that add npm packages or Actions with known vulnerabilities (moderate or higher).
  # The data service (workers/data) bundled by wrangler without publishing: a wrong import, a mistake in wrangler.toml or
  # a migration that does not parse is found here, not by the deploy on main (which would roll back). No secrets.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node scripts/data-sites.mjs
      - run: npm ci --ignore-scripts
        working-directory: workers/data
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        working-directory: workers/data
        env:
          WRANGLER_SEND_METRICS: "false"

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Checks the workflows for common GitHub Actions security issues (permissions, injection, tokens).
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Findings are written to the log and fail the check. No upload to Code scanning (needs more permissions).
          advanced-security: false
