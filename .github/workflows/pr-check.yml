name: PR check

# Builds the site for every PR against main, so an invalid site file or a template error is caught before
# it reaches main and breaks publishing. Publishes nothing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Timeout on every job (timeout-minutes): if a GitHub runner hangs, the job stops by itself
# instead of blocking for up to 6 hours.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no package's install script runs (none of the dependencies need one).
      - run: npm ci --ignore-scripts

      - run: npm test

      # Image variants from the deploy build on main (same key as in deploy.yml), so the PR build is quicker.
      # Only restored, never saved, so a PR cannot change what main uses.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: site-img-${{ hashFiles('src/sites/**/*.jpg', 'lib/images.js', 'lib/photo-credit.js', 'lib/site-images.js', 'package-lock.json') }}

      # Site file validation happens during the build. The wind forecast is skipped, so PRs do not query MET.
      - run: npm run build
        env:
          FORECAST_OFFLINE: "1"

  # Blocks PRs that add npm packages or Actions with known vulnerabilities (moderate or higher).
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Checks the workflows for common GitHub Actions security issues (permissions, injection, tokens).
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Findings are written to the log and fail the check. No upload to Code scanning (needs more permissions).
          advanced-security: false
