name: PR-sjekk

# Bygger siden for hver PR mot main, så en ugyldig stedsfil eller en feil i en mal blir fanget før
# den når main og stopper publiseringen. Publiserer ingenting.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# En ny push til samme PR avbryter kjøringen for den forrige: bare den nyeste commiten teller.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

# Tidsgrense på hver jobb (timeout-minutes): henger en runner hos GitHub, stopper jobben av seg selv
# i stedet for å blokkere i opptil 6 timer.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      - run: npm test

      # ESLint, bare de anbefalte reglene (eslint.config.js): et navn som ikke er definert, eller en ubrukt variabel
      # testene ikke når.
      - run: npm run lint

      # Bildevarianter fra publiseringsbygget på main (samme nøkkel som i deploy.yml), så bygget for PR-en går raskere.
      # Bare hentet, aldri lagret, så en PR ikke kan endre det main bruker.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: site-img-${{ hashFiles('src/sites/**/*.jpg', 'lib/images.js', 'lib/photo-credit.js', 'lib/site-images.js', 'package-lock.json') }}

      # Stedsfilene valideres under bygget. Vindvarselet hoppes over, så PR-er ikke spør MET.
      - run: npm run build
        env:
          FORECAST_OFFLINE: "1"

      # Hver intern lenke og hvert bilde peker på en fil som finnes (lib/link-check.js). Uten nett.
      - run: npm run check:links

      # HTML-validering av hver side (.htmlvalidate.mjs lister reglene som er slått av, og hvorfor).
      - run: npm run check:html

      # Ingen «[object Object]», «undefined», «NaN» eller plassholdere som ikke er fylt ut, i sidene
      # (lib/output-check.js).
      - run: npm run check:output

      # De bygde sidene til tilgjengelighetssjekken, uten bildevariantene (store, og ikke nødvendige for sjekken).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            _site
            !_site/img
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # axe-core i Chromium på noen sider som dekker malene, i lys og mørk modus (scripts/check-a11y.mjs).
  # Feiler på funn med alvorlighet serious eller critical. Deretter sjekken av hva sidene gjør, i samme nettleser
  # (nedenfor).
  accessibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakkers installasjonsskript kjører (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      # Chromium i versjonen som passer til Playwright i package-lock.json, fra bufferen som browser-cache.yml fyller
      # på main (en buffer en PR lager, ses bare av den PR-en). Ved bom installeres den med systembibliotekene den
      # trenger, noe som har tatt runneren opptil ti minutter; ved treff har runner-imaget dem allerede (det har
      # Chrome).
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - run: npm run check:a11y

      # Hva sidene gjør i nettleseren (scripts/check-behaviour.mjs): kartmarkører ved zoom, «Piloter i lufta»,
      # datatjenesten nede, «Meld fra», offline. Uten nett: skriptet svarer for datatjenesten og Turnstile.
      - run: npm run check:behaviour

      # Ytelsesbudsjettet (scripts/check-budget.mjs): bytes per type, forespørsler, DOM-noder og layoutforskyvning per
      # side, mot grenser satt litt over dagens, så en side som blir mye tyngre, feiler her.
      - run: npm run check:budget

  # Datatjenesten (workers/data) pakket av wrangler uten publisering: en feil import, en feil i wrangler.toml eller
  # en migrering som ikke kan leses, blir funnet her, ikke av publiseringen på main (som ville rullet tilbake). Ingen
  # hemmeligheter.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node scripts/data-sites.mjs
      - run: npm ci --ignore-scripts
        working-directory: workers/data
      - run: npm audit signatures
        working-directory: workers/data
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        working-directory: workers/data
        env:
          WRANGLER_SEND_METRICS: "false"

  # Stopper PR-er som legger til npm-pakker eller Actions med kjente sårbarheter (moderate eller høyere).
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # Sjekker arbeidsflytene for vanlige sikkerhetsproblemer i GitHub Actions (tillatelser, injeksjon, tokener).
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Funnene skrives til loggen og får sjekken til å feile. Ingen opplasting til Code scanning (krever
          # flere tillatelser).
          advanced-security: false
