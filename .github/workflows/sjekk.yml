name: Sjekk PR

# Bygger siden for hver PR mot main, så en ugyldig stedsfil eller en feil i malene stoppes før
# den kommer på main og stopper publiseringen. Publiserer ingenting.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Valideringen av stedsfilene skjer i byggingen. Vindvarselet hoppes over, så PR-er ikke spør MET.
      - run: npm run build
        env:
          FORECAST_OFFLINE: "1"
