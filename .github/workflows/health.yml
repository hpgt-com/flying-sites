name: Helsesjekk for datatjenesten

# Sjekker datatjenesten utenfra én gang i timen (/v1/status.json, workers/data/src/health.js): at den svarer, at
# hvert datasett er innenfor aldersgrensen, at sikkerhetskopien ikke henger etter, og at ingen kilde har feilet i et
# døgn. Åpner en sak når noe er galt (en kommentar på den åpne når problemene endres), og lukker den når alt er i
# orden igjen; kjøringen feiler så lenge det er problemer, så de vises i historikken under Actions også. GitHub kan
# kjøre den sent, og det går fint for en sjekk som denne; GitHub slår også av tidsplanen etter 60 dager uten commit,
# så en ekstern overvåking (se SECURITY.md) er den egentlige vakten. Kjører ingen kode fra prosjektet og trenger
# ingen hemmeligheter.

on:
  schedule:
    - cron: "41 * * * *" # hver time, 41 minutter over
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Sjekk datatjenesten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS_URL: https://data.hpgt.com/v1/status.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Datatjenesten: data mangler eller er for gamle"
          # Hva som regnes som et problem: et datasett over aldersgrensen, starter som mangler i et datasett,
          # sikkerhetskopien på etterskudd, og en kilde der siste kjøring feilet og siste vellykkede er mer enn et døgn
          # siden (eller aldri). En kilde som feilet én gang og så lyktes, er ikke et problem: kildene snakker med
          # andres servere og feiler av og til, og et datasett som fortsatt er ferskt, viser at tjenesten klarte seg.
          # Feiltekstene kommer fra de serverne, så de settes i backticks, med backticks og linjeskift fjernet.
          if body=$(curl -fsS --max-time 30 --retry 2 "$STATUS_URL") && echo "$body" | jq -e . > /dev/null; then
            problems=$(echo "$body" | jq -r '
              def t: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
              def clean: gsub("[`\n\r]"; " ");
              [.datasets | to_entries[] | select(.value.ok | not) | "- \(.key): sist skrevet \(.value.updated // "aldri") (\(.value.ageMinutes // "?") min, grense \(.value.maxAgeMinutes) min)"]
              + [.datasets | to_entries[] | select((.value.missing // []) | length > 0) | "- \(.key): mangler \(.value.missing | join(", "))"]
              + [.backup // empty | select(.ok | not) | "- backup: siste \(.day // "aldri") (\(.daysAgo // "?") dager siden, grense \(.maxDays) dager)"]
              + [.sources | to_entries[] | select(.value.errorAt and (.value.ok == null or .value.errorAt > .value.ok))
                  | select(.value.ok == null or (now - (.value.ok | t)) > 86400)
                  | "- kilden \(.key) feilet sist \(.value.errorAt), sist vellykket \(.value.ok // "aldri"): `\(.value.error | clean)`"]
              | join("\n")')
          else
            problems="- $STATUS_URL svarte ikke, eller ikke med JSON."
          fi
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$problems" ]; then
            echo "Alt i orden."
            if [ -n "$n" ]; then gh issue close "$n" --comment "I orden igjen: $RUN_URL"; fi
            exit 0
          fi
          echo "$problems"
          if [ -n "$n" ]; then
            # En kommentar bare når listen over problemer har endret seg siden forrige, så saken ikke fylles med
            # én kommentar i timen som sier det samme.
            last=$(gh issue view "$n" --json body,comments --jq '[.body] + (.comments | map(.body)) | last' | grep '^- ' || true)
            if [ "$last" = "$problems" ]; then
              echo "Uendret siden forrige melding på #$n."
            else
              gh issue comment "$n" --body "Fortsatt ($RUN_URL):

          $problems"
            fi
          else
            gh issue create --title "$title" --label bug --body "Den timevise sjekken av datatjenesten fant dette ($RUN_URL):

          $problems

          Se loggene i Cloudflare (Workers → data → Observability) og docs/operations.md. Saken lukkes av seg selv når alt er i orden igjen."
          fi
          # Kjøringen feiler, så problemet vises i historikken under Actions og i merket, ikke bare i saken.
          exit 1
