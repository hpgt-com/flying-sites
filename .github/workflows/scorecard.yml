name: Scorecard

# OpenSSF Scorecard: sjekker repoet mot god praksis for forsyningskjeden (låste actions, tillatelser for tokener,
# grenbeskyttelse, kodegjennomgang, oppdatering av avhengigheter med mer). Resultatene går til Code scanning og til
# det offentlige Scorecard-API-et, som merket i README leser.
# Følger malen fra ossf/scorecard-action. Med publish_results kan jobben bare ha disse stegene.

# Ukentlig, ikke ved hver push: sjekkene ser på innstillingene og historikken til repoet, som én merge sjelden endrer,
# og merket leser API-et, som den ukentlige kjøringen oppdaterer.
on:
  schedule:
    - cron: "23 4 * * 1" # mandager kl. 04:23 UTC
  # Kjøres på nytt når grenbeskyttelsen endres, siden den er en av sjekkene.
  branch_protection_rule:
  workflow_dispatch:

# Ingen tilgang som standard. Jobben ber om det den trenger.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      security-events: write # laster opp resultatene til Code scanning
      id-token: write # signerer resultatene som publiseres til Scorecard-API-et
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
