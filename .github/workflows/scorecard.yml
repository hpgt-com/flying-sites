name: Scorecard

# OpenSSF Scorecard: checks the repository against supply-chain good practice (pinned actions, token permissions,
# branch protection, code review, dependency updates and more). The results go to Code scanning and to the public
# Scorecard API, which the badge in README reads.
# Follows the template from ossf/scorecard-action. With publish_results the job may only contain these steps.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays at 04:23 UTC
  # Rerun when branch protection changes, since it is one of the checks.
  branch_protection_rule:
  workflow_dispatch:

# No access by default. The job asks for what it needs.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      security-events: write # uploads the results to Code scanning
      id-token: write # signs the results published to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
