name: OWASP ZAP

# En passiv sikkerhetsskanning av den publiserte siden med OWASP ZAP (baseline): den går gjennom sidene i ett minutt
# og bare leser dem, og rapporterer manglende sikkerhetshoder, cookie-flagg, informasjonslekkasjer og lignende. Den
# angriper ikke. Månedlig og for hånd; også på en pull request som endrer denne filen, så en endring i skanningen
# viser resultatet sitt. Rapporten er en artefakt på kjøringen (zap-flysteder). Ingen saker åpnes, og ingen token
# brukes.

on:
  schedule:
    - cron: "41 4 3 * *" # den 3. hver måned, kl. 04:41 UTC
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/zap.yml]

permissions: {}

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://flysteder.hpgt.com/
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-flysteder
