name: OWASP ZAP

# A passive security scan of the published site with OWASP ZAP (baseline): it crawls the pages for a minute and only
# reads them, reporting missing security headers, cookie flags, information leaks and the like. It does not attack.
# Monthly and by hand; also on a pull request that changes this file, so a change to the scan shows its result.
# The report is an artifact on the run (zap-flysteder). No issues are opened and no token is used.

on:
  schedule:
    - cron: "41 4 3 * *" # the 3rd of every month, 04:41 UTC
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/zap.yml]

permissions: {}

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://flysteder.hpgt.com/
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-flysteder
