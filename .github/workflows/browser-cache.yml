name: Nettleserbuffer

# Fyller bufferen med Playwright-nettleseren som tilgjengelighetsjobben i PR-sjekken bruker (pr-check.yml). En buffer
# laget av en PR sin egen kjøring ses bare av den PR-en, så uten denne lastet hver PR ned Chromium på nytt, og
# apt-steget i nedlastingen hang runneren i ti minutter mer enn én gang (22.10.2026). En buffer laget på main ses av
# alle PR-er. Kjører når Playwright-versjonen kan ha endret seg (package-lock.json på main), og for hånd. Trenger
# ingen hemmeligheter.
on:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - .github/workflows/browser-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # Samme sti og nøkkel som i pr-check.yml, så PR-sjekken finner den.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
