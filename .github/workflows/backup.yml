name: Sikkerhetskopi

# Kopien hos en annen leverandør, hver natt etter datatjenestens egen sikkerhetskopi (02:14 UTC,
# workers/data/src/backup.js): hele arkivbøtta i R2 (målinger per dag, de nattlige sikkerhetskopiene av historikken)
# kopieres til en bøtte hos en annen leverandør (Backblaze B2), så en tapt Cloudflare-konto eller bøtte ikke gjør at
# dataene går tapt. Kopien sjekkes etterpå: hver fil i R2 må finnes i kopien med samme sjekksum (rclone check), og
# siste sikkerhetskopi av hver tabell må finnes, kunne leses og være fra i dag eller i går (scripts/check-backup.mjs).
# Koden og sakene kopieres også: sakene som JSON hver natt, hele Git-historikken som en bundle på søndager (og når
# den kjøres for hånd). Ingenting slettes noen gang fra kopien (rclone copy, ikke sync), og bøtta tar vare på gamle
# versjoner, så en dårlig natt ikke kan ødelegge en god kopi. Når noe feiler, åpnes en sak (en kommentar på den åpne
# når meldingen endres), og den lukkes når en natt går bra igjen. Nøklene ligger i GitHub-miljøet «backup»
# (docs/operations.md «Kontoer og hemmeligheter»): hemmelighetene R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (bare
# lesing, bare arkivbøtta), B2_KEY_ID, B2_APPLICATION_KEY (bare backup-bøtta); variablene R2_ENDPOINT og B2_ENDPOINT
# (bøttas S3-adresse, s3.<region>.backblazeb2.com), og R2_BUCKET og B2_BUCKET bare når navnene er andre enn
# standardverdiene nedenfor.

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC, etter datatjenestens sikkerhetskopi kl. 02:14
  workflow_dispatch:

permissions: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    # shell: bash legger til pipefail, så en rclone som feiler, ikke skjules av «| tail» (GitHubs standardskall har
    # ikke pipefail).
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      issues: write
    env:
      # rclone leser fjernlagrene fra miljøet: «r2» (Cloudflare) og «b2» (Backblaze), begge over S3-API-et.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      # Bøttenavnene er ikke hemmelige og har standardverdier her; variablene overstyrer dem for en annen konto eller
      # bøtte.
      R2_BUCKET: ${{ vars.R2_BUCKET || 'hpgt-data-archive' }}
      B2_BUCKET: ${{ vars.B2_BUCKET || 'hpgt-flysteder-backup' }}
    steps:
      - name: Sjekk at nøklene og adressene er satt
        run: |
          missing=""
          for v in RCLONE_CONFIG_R2_ENDPOINT RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY RCLONE_CONFIG_B2_ENDPOINT RCLONE_CONFIG_B2_ACCESS_KEY_ID RCLONE_CONFIG_B2_SECRET_ACCESS_KEY R2_BUCKET B2_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Mangler i miljøet backup:$missing (se docs/operations.md «Kontoer og hemmeligheter»)"; exit 1; fi
          # B2 signerer med regionen i adressen (s3.<region>.backblazeb2.com), så rclone får vite hvilken det er.
          region=$(echo "$RCLONE_CONFIG_B2_ENDPOINT" | sed -E 's#^https?://##; s#/.*$##; s#^s3\.([a-z0-9-]+)\.backblazeb2\.com$#\1#')
          echo "RCLONE_CONFIG_B2_REGION=$region" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Installer rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null && rclone version | head -1

      - name: Kopier arkivet fra R2 til B2
        # copy, aldri sync: ingenting slettes fra kopien. Filer som allerede finnes med samme sjekksum, hoppes over.
        # --checksum sammenligner MD5 (ETag) fra listene, så rclone aldri spør B2 om endringstiden for hver fil. Uten
        # den gjorde hver kjøring én HEAD per fil i kopien (en Class B-transaksjon), og arkivet vokser med omtrent 20
        # filer om dagen: 18.11.2026 nådde to kjøringer B2s gratisgrense på 2 500 per dag. Nå koster en kjøring noen få
        # lister.
        run: rclone copy "r2:$R2_BUCKET" "b2:$B2_BUCKET/archive" --checksum --transfers 8 --checkers 16 --fast-list --stats-one-line --stats 0 -v 2>&1 | tail -20

      - name: Sjekk at hele arkivet er kopiert
        # Hver fil i R2 må finnes i kopien med samme sjekksum. Sammenligner bare listene (Class C hos B2).
        run: rclone check "r2:$R2_BUCKET" "b2:$B2_BUCKET/archive" --one-way --checksum --fast-list 2>&1 | tail -5

      - name: Sjekk kopien av sikkerhetskopien
        # Siste sikkerhetskopi av hver tabell leses tilbake fra kopien (ikke fra R2), så det som sjekkes, er det en
        # gjenoppretting ville brukt.
        run: |
          for t in flight_days verify_hours flights; do
            rclone copyto "b2:$B2_BUCKET/archive/backup/$t/latest.json" "copy/$t/latest.json" || true
          done
          node scripts/check-backup.mjs copy

      - name: Kopier sakene og koden
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p out/github out/git
          # Alle saker og pull requests med kommentarene, slik API-et gir dem: «Meld fra» havner her og ingen andre
          # steder.
          gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" > out/github/issues.json
          gh api --paginate "repos/$GH_REPO/issues/comments?per_page=100" > out/github/issue-comments.json
          echo "saker: $(jq length out/github/issues.json), kommentarer: $(jq length out/github/issue-comments.json)"
          # Hele historikken som én fil, på søndager og ved kjøring for hånd: den er 50 MB, og bøtta tar vare
          # på gamle versjoner.
          if [ "$(date -u +%u)" = "7" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git bundle create out/git/flying-sites.bundle --all
            git bundle verify out/git/flying-sites.bundle
          fi
          rclone copy out "b2:$B2_BUCKET" --checksum --fast-list --stats-one-line --stats 0 -v 2>&1 | tail -5

      - name: Sjekk sakene og koden i kopien
        # Det som nettopp ble lastet opp, må finnes i B2 med samme sjekksum, og Git-bundlen kan være høyst 8 dager
        # gammel (den skrives på søndager), så en uke som mangler, blir oppdaget.
        run: |
          rclone check out "b2:$B2_BUCKET" --one-way --checksum --fast-list 2>&1 | tail -5
          for f in issues.json issue-comments.json; do jq -e 'type == "array"' "out/github/$f" > /dev/null; done
          modtime=$(rclone lsjson "b2:$B2_BUCKET/git/" --files-only --fast-list --use-server-modtime | jq -r '.[] | select(.Name == "flying-sites.bundle") | .ModTime')
          [ -n "$modtime" ] || { echo "git/flying-sites.bundle mangler i kopien"; exit 1; }
          age=$(( ( $(date -u +%s) - $(date -u -d "$modtime" +%s) ) / 86400 ))
          echo "git/flying-sites.bundle: $age dager gammel"
          [ "$age" -le 8 ] || { echo "git/flying-sites.bundle er $age dager gammel (grense 8)"; exit 1; }

      - name: Si fra når det feiler, og lukk saken når det går igjen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Backup: den nattlige kopien feilet"
          n=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "I orden igjen: $RUN_URL"; fi
            exit 0
          fi
          body="Den nattlige kopien av arkivet og sikkerhetskopien til B2 feilet ($RUN_URL). Se loggen for hvilket steg, og docs/operations.md «Værarkivet (R2)» for nøklene og miljøet «backup». Saken lukkes av seg selv når en natt går gjennom igjen."
          if [ -n "$n" ]; then gh issue comment "$n" --body "Fortsatt: $RUN_URL"; else gh issue create --title "$title" --label bug --body "$body"; fi
