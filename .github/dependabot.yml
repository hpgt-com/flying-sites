# Dependabot åpner PR-er når det kommer nye versjoner av GitHub Actions og npm-pakkene.
# Én samlet PR per økosystem per måned. PR-sjekken bygger siden, så den kan merges når den er grønn.
# cooldown: nye versjoner foreslås først etter 7 dager (major etter 30 for npm, ikke github-actions), så en
# kompromittert release rekker å bli oppdaget og trukket før den kommer hit.
# labels: bare «dependencies», så Dependabot ikke legger til etiketter per økosystem (javascript, github_actions).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm:
        patterns: ["*"]

  # Wrangler for datatjenesten (workers/data), i en egen pakke så bygget av siden ikke installerer den.
  - package-ecosystem: npm
    directory: /workers/data
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      data-worker:
        patterns: ["*"]
