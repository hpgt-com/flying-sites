# Dependabot opens PRs when new versions of GitHub Actions and the npm packages are released.
# One grouped PR per ecosystem per month. The PR check builds the site, so it is safe to merge when green.
# cooldown: new versions are only proposed after 7 days, so a compromised release
# has time to be discovered and pulled before it gets here.
# labels: only "dependencies", so Dependabot does not add per-ecosystem labels (javascript, github_actions).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # Wrangler for the weather service (workers/forecast), in its own package so the site build does not install it.
  - package-ecosystem: npm
    directory: /workers/forecast
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      forecast-worker:
        patterns: ["*"]
