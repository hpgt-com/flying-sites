# Dependabot lager PR-er når det kommer nye versjoner av GitHub Actions og npm-pakkene.
# Én samlet PR per økosystem i måneden. PR-sjekken bygger siden, så det er trygt å merge når den er grønn.
# cooldown: nye versjoner foreslås først når de har vært ute i 7 dager, så en kompromittert utgivelse
# rekker å bli oppdaget og trukket før den kommer hit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
