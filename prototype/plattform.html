:root {
  --bg: #F3F5F4; --text: #1C2B33; --muted: #45545C; --line: #C3D0CF; --line-soft: #D5DEDD;
  --fjord: #2E5E6E; --accent: #C24A12; --dir-primary: #3D7A8A; --possible: #8FBCC7;
  --card: #FFFFFF; --surface: #E6ECEB; --link: #2E5E6E; --on-color: #FFFFFF;
  --hazard-bg: #FBE3DA; --hazard-text: #6B1A0B;
  --ok: #2E8B57; --warn: #D99A1E; --bad: #C62828; --none: #7F9396;
  --s0: #DCE9EC; --s1: #A9CBD4; --s2: #5F9AAA; --s3: #2E5E6E; --s4: #C24A12;
  --map-bg: #E3ECEC; --map-grid: #CCD9D8; --proto: #FFF4D6; --proto-text: #6A4A00;
  --font-heading: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius: 12px;
  color-scheme: light;
}

  --fjord: #3C7486; --accent: #D65A1E; --dir-primary: #5B9BAB; --possible: #3F7482;
  --card: #1A242A; --surface: #223038; --link: #8CC3D3; --on-color: #FFFFFF;
  --hazard-bg: #3A1E16; --hazard-text: #F6C9B8;
  --ok: #3FA56B; --warn: #E0A93A; --bad: #E05252; --none: #8A9C9F;

  color-scheme: dark;
}}
:root[data-theme="dark"] {

  --fjord: #3C7486; --accent: #D65A1E; --dir-primary: #5B9BAB; --possible: #3F7482;

  --ok: #3FA56B; --warn: #E0A93A; --bad: #E05252; --none: #8A9C9F;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font-body); }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--font-heading); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 600; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* Topp */
.top { background: var(--fjord); color: #fff; padding-inline: 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; letter-spacing: .01em; white-space: nowrap; }
.brand span { font-weight: 500; opacity: .75; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { color: #fff; text-decoration: none; font-family: var(--font-heading); font-weight: 600; font-size: 1.05rem; padding: 8px 12px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center; }
nav.tabs a:hover { background: rgba(255,255,255,.12); }
nav.tabs a[aria-current="page"] { background: #fff; color: #2E5E6E; }
.proto-bar { background: var(--proto); color: var(--proto-text); font-size: .875rem; padding: 6px 16px; text-align: center; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
.view { display: grid; gap: 24px; }
.lead { max-width: 68ch; color: var(--muted); font-size: 1.05rem; }
.head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-heading); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; color: var(--accent); }
.grid2 { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .grid2.even { grid-template-columns: 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--text); white-space: nowrap; }
.tag.primary { background: var(--dir-primary); color: #fff; }
.tag.possible { background: var(--possible); color: var(--text); }
.tag.ok { background: var(--ok); color: #fff; } .tag.warn { background: var(--warn); color: #1C2B33; } .tag.bad { background: var(--bad); color: #fff; } .tag.none { background: var(--none); color: #fff; }
.tag.new { background: var(--accent); color: #fff; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: 600 1rem var(--font-body); border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--link); border: 1px solid var(--line); }
.btn:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: 600 .9rem var(--font-body); background: var(--card); color: var(--text); border: 0; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fjord); color: #fff; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface); }
.scroll { overflow-x: auto; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: .875rem; }
.note { background: var(--proto); color: var(--proto-text); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
svg text { font-family: var(--font-body); }
.t-ink { fill: var(--text); } .t-muted { fill: var(--muted); } .t-head { font-family: var(--font-heading); font-weight: 600; }
.g-line { stroke: var(--line-soft); } .g-axis { stroke: var(--line); }

/* Kart */
.mapwrap { background: var(--map-bg); border-radius: var(--radius); border: 1px solid var(--line-soft); overflow: hidden; position: relative; }
.mapwrap svg { display: block; width: 100%; height: auto; max-height: 78vh; }
.map-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
.site-dot { fill: var(--dir-primary); stroke: var(--card); stroke-width: 2; cursor: pointer; }
.site-dot.dim { fill: var(--none); }
.site-lbl { font-size: 11px; fill: var(--muted); pointer-events: none; }
.st-ring { fill: var(--card); stroke: var(--text); stroke-width: 1.5; cursor: pointer; }
.st-ring.prop { stroke-dasharray: 3 2; }
.st-val { font: 700 12px var(--font-body); fill: var(--text); pointer-events: none; }
.st-arrow { fill: var(--accent); pointer-events: none; }
.st-name { font: 600 11.5px var(--font-body); fill: var(--text); pointer-events: none; paint-order: stroke; stroke: var(--map-bg); stroke-width: 3px; }
.st-g:hover .st-ring, .st-g:focus .st-ring { stroke: var(--accent); stroke-width: 2.5; }
.st-g { outline: none; }

.stlist { display: grid; gap: 8px; }
.strow { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--card); text-decoration: none; color: inherit; }
.strow:hover { border-color: var(--dir-primary); }
.strow .big { font-family: var(--font-heading); font-weight: 700; font-size: 1.5rem; text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
.strow .big small { font-size: .85rem; font-weight: 500; color: var(--muted); }

.now { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.now .val { font-family: var(--font-heading); font-size: 3.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.now .val small { font-size: 1.1rem; font-weight: 500; color: var(--muted); }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .93rem; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; font-variant-numeric: tabular-nums; }

.site-assess { display: grid; gap: 10px; }
.assess-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface); }

/* Heatmap */
.hm { display: grid; grid-template-columns: 34px repeat(17, minmax(0, 1fr)); gap: 2px; font-size: .72rem; }
.hm div { aspect-ratio: 1.3; border-radius: 3px; }
.hm .lab { aspect-ratio: auto; color: var(--muted); display: flex; align-items: center; }
.hm .hl { aspect-ratio: auto; color: var(--muted); text-align: center; }
.hm-scale { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.hm-scale i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }

/* Logg */
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--card); }
.drop.over { border-color: var(--accent); background: var(--surface); }
.flist { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.frow[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.frow .d { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.form label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; }
.form input, .form select, .form textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 42px; }
.form .full { grid-column: 1 / -1; }

/* Klubb */
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0,1fr) 44px; gap: 10px; align-items: center; font-size: .92rem; }
.bar .track { height: 14px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--dir-primary); border-radius: 4px; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.rank { font-family: var(--font-heading); font-weight: 700; color: var(--muted); width: 1.5em; display: inline-block; }

/* Plan */
.matrix td:first-child { font-weight: 600; }
.verdict { font-weight: 600; }
.verdict.build { color: var(--ok); } .verdict.integ { color: var(--link); } .verdict.skip { color: var(--muted); }
.phases { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.phase { border-top: 4px solid var(--dir-primary); }
.phase:nth-child(2) { border-top-color: var(--possible); } .phase:nth-child(3) { border-top-color: var(--line); }
.phase ul, .card ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.prose { max-width: 70ch; display: grid; gap: 10px; }
.crumb { font-size: .9rem; } .crumb a { text-decoration: none; }
@media (prefers-reduced-motion: no-preference) { .view { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }
@media (max-width: 560px) { h1 { font-size: 1.75rem; } .now .val { font-size: 2.6rem; } .hm { font-size: .6rem; grid-template-columns: 26px repeat(17, minmax(0, 1fr)); } }
</style>

const sectorOf = deg => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const fmt = (n, d = 1) => n.toLocaleString("nb-NO", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function distKm(a, b) { const R = 6371, r = Math.PI / 180; const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r; const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2; return 2 * R * Math.asin(Math.sqrt(x)); }

/* Felles vindfelt for 30 dager, timeverdier. Hver stasjon får terrengjustering. */
const REGION = (() => {
  const r = rng(42); let dir = 200, sp = 4; const out = [];
  for (let i = 0; i < HOURS; i++) {
    const t = new Date(NOW.getTime() - (HOURS - 1 - i) * 3600e3);
    dir += (r() - .5) * 28 + (r() < .02 ? (r() - .5) * 160 : 0);
    sp += (r() - .5) * 1.3 + (4.2 - sp) * .04;
    sp = Math.max(.3, Math.min(14, sp));
    const diurnal = Math.sin((t.getHours() - 8) / 24 * 2 * Math.PI) * 1.1;
    out.push({ t, dir: (dir % 360 + 360) % 360, sp: Math.max(.2, sp + diurnal), temp: 7 + Math.sin((t.getHours() - 9) / 24 * 2 * Math.PI) * 3 + (r() - .5) * 2 - i / HOURS * 3 });
  }
  return out;
})();
const OBS = Object.fromEntries(STATIONS.map((s, k) => {
  const r = rng(100 + k);
  return [s.id, REGION.map(o => {
    const sp = Math.max(.1, o.sp * s.fx + (r() - .5) * 1.4);
    const gust = sp + .8 + r() * (1.5 + sp * .35);
    return { t: o.t, dir: ((o.dir + s.dOff + (r() - .5) * 30) % 360 + 360) % 360, sp, gust, temp: o.temp - s.alt / 150 };
  })];
}));
const latest = id => OBS[id][HOURS - 1];

function assess(site, o) {
  if (!o) return { cls: "none", label: "Ingen data" };
  const sec = sectorOf(o.dir);
  if (o.sp > RULES.maxWind || o.gust > RULES.maxGust) return { cls: "bad", label: "For mye vind", why: o.gust > RULES.maxGust ? `kast ${fmt(o.gust)} m/s` : `middel ${fmt(o.sp)} m/s` };
  const prim = site.d.includes(sec), poss = site.p.includes(sec);
  if (!prim && !poss) return { cls: "bad", label: "Passer ikke", why: `vind fra ${DIR_WORD[sec]}` };
  if (!prim || o.sp < RULES.minWind || o.gust - o.sp > RULES.maxGustSpread) return { cls: "warn", label: "Usikkert", why: !prim ? "mulig retning" : o.sp < RULES.minWind ? "svak vind, usikker retning" : "byig" };
  return { cls: "ok", label: "Kan passe", why: `${DIR_WORD[sec]} ${fmt(o.sp)} m/s` };
}
const nearestStations = (site, n = 3) => STATIONS.map(s => ({ s, km: distKm(site, s) })).sort((a, b) => a.km - b.km).slice(0, n);
const nearestSites = (st, maxKm = 9) => SITES.map(s => ({ s, km: distKm(st, s) })).filter(x => x.km <= maxKm).sort((a, b) => a.km - b.km);
function flyableHours(site, stId, days = 30) {
  const arr = OBS[stId].slice(-24 * days); let n = 0;
  for (const o of arr) { const h = o.t.getHours(); if (h >= 8 && h <= 21 && assess(site, o).cls === "ok") n++; }
  return n;
}

/* Flyturer i klubben (fiktive piloter) */
const PILOTS = ["Ingrid L.","Martin S.","Siri B.","Jonas K.","Eirik H.","Mari T.","Anders V.","Hanne R.","Tor E.","Lene A.","Ola M.","Kristin F.","Petter N.","Ane G."];
const ME = "Siri B.";
const FLIGHTS = (() => {
  const r = rng(7), out = [];
  const pop = { sollifjellet: 9, storlitinden: 6, rodmoldheia: 5, hogfjellet: 5, elgen: 4, nontua: 3, steinsasen: 3, storhornet: 2, vetefjellet: 2, keipen: 2, saetertinden: 1.5, reinfjellet: 1, heia: 1, blahatten: 1, kilhusasen: 1, nupen: 1, trastad: .6, mela_aksla: .5 };
  const pool = []; for (const [k, w] of Object.entries(pop)) { const id = k.replace("_", "-"); for (let i = 0; i < w * 10; i++) pool.push(id); }
  for (let i = 0; i < 236; i++) {
    const site = SITE[pool[Math.floor(r() * pool.length)]];
    const pilot = PILOTS[Math.floor(Math.pow(r(), 1.6) * PILOTS.length)];
    const yr = r() < .62 ? 2026 : r() < .6 ? 2025 : 2024;
    const m = Math.min(10, Math.max(2, Math.round(6 + (r() + r() + r() - 1.5) * 4)));
    if (yr === 2026 && m > 9) continue;
    const day = 1 + Math.floor(r() * 27), hr = 10 + Math.floor(r() * 9);
    const xc = r() < .12 && site.alt > 450;
    const km = xc ? 8 + Math.pow(r(), 1.5) * 38 : 1 + r() * (site.alt ? site.alt / 160 : 2);
    const min = xc ? 40 + km * 3.2 + r() * 40 : 5 + r() * 25 + (site.alt ? site.alt / 60 : 0) * r();
    const date = new Date(yr, m - 1, day, hr, Math.floor(r() * 60));
    if (date > NOW) continue;
    out.push({ id: "f" + i, site: site.id, pilot, date, km, min, maxAlt: Math.round((site.alt || 200) + (xc ? 600 + r() * 900 : r() * 250)), wing: r() < .15 && site.c.includes("SPG") ? "SPG" : "PG", xc });
  }
  // Noen tydelige turer for innlogget pilot
  out.push({ id: "me1", site: "hogfjellet", pilot: ME, date: new Date(2026, 6, 14, 13, 5), km: 31.4, min: 142, maxAlt: 1720, wing: "PG", xc: true });
  out.push({ id: "me2", site: "sollifjellet", pilot: ME, date: new Date(2026, 9, 4, 12, 40), km: 3.1, min: 24, maxAlt: 790, wing: "PG", xc: false });
  return out.sort((a, b) => b.date - a.date);
})();
const fmtDate = d => d.toLocaleDateString("nb-NO", { day: "numeric", month: "short", year: "numeric" });
const fmtDur = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;

/* ---------- Tegnehjelpere ---------- */
const MAPB = { lat0: 68.565, lat1: 68.925, lon0: 15.97, lon1: 16.6 };
function proj(lat, lon, W = 600) {
  const k = Math.cos(68.75 * Math.PI / 180);
  const wDeg = (MAPB.lon1 - MAPB.lon0) * k, hDeg = MAPB.lat1 - MAPB.lat0, H = W * hDeg / wDeg;
  return { x: (lon - MAPB.lon0) * k / wDeg * W, y: (MAPB.lat1 - lat) / hDeg * H, H };
}
function stationMarker(st, o, opts = {}) {
  const p = proj(st.lat, st.lon); const r = 15;
  return `<g class="st-g" tabindex="0" role="link" aria-label="${esc(st.name)}: ${fmt(o.sp)} m/s fra ${DIR_WORD[sectorOf(o.dir)]}" data-go="stasjon-${st.id}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">
    <g transform="rotate(${o.dir.toFixed(0)})"><path class="st-arrow" d="M0,-${r + 2} l-6,-11 l6,3 l6,-3z"/></g>
    <circle class="st-ring ${st.kind === "forslag" ? "prop" : ""}" r="${r}"/>
    <text class="st-val" text-anchor="middle" y="4">${Math.round(o.sp)}</text>
    ${opts.label !== false ? `<text class="st-name" x="${r + 6}" y="4">${esc(st.name)}</text>` : ""}
  </g>`;
}
function mapSVG({ highlightSite = null, focusStation = null, showSites = true, label = true } = {}) {
  const { H } = proj(MAPB.lat0, MAPB.lon0); let g = "";
  for (let lat = 68.6; lat < MAPB.lat1; lat += .05) { const y = proj(lat, MAPB.lon0).y; g += `<line class="g-line" x1="0" x2="600" y1="${y}" y2="${y}"/><text class="t-muted" font-size="10" x="4" y="${y - 3}">${lat.toFixed(2)}°N</text>`; }
  for (let lon = 16.0; lon < MAPB.lon1; lon += .1) { const x = proj(MAPB.lat0, lon).x; g += `<line class="g-line" y1="0" y2="${H}" x1="${x}" x2="${x}"/><text class="t-muted" font-size="10" x="${x + 3}" y="${H - 6}">${lon.toFixed(1)}°Ø</text>`; }
  let s = "";
  if (showSites) for (const site of SITES) {
    const p = proj(site.lat, site.lon); const hi = site.id === highlightSite;
    const crowded = STATIONS.some(st => { const q = proj(st.lat, st.lon); return Math.abs(q.x - p.x) < 95 && Math.abs(q.y - p.y) < 16; });
    s += `<g data-go="sted-${site.id}" style="cursor:pointer"><circle class="site-dot" cx="${p.x}" cy="${p.y}" r="${hi ? 7 : 4.5}" ${hi ? 'style="fill:var(--accent)"' : ""}/>${(label && !crowded) || hi ? `<text class="site-lbl" x="${p.x + 7}" y="${p.y - 6}" ${hi ? 'style="font-weight:700;fill:var(--text)"' : ""}>${esc(site.name)}</text>` : ""}</g>`;
  }
  let m = ""; for (const st of STATIONS) if (!focusStation || st.id === focusStation || true) m += stationMarker(st, latest(st.id), { label: true });
  return `<svg viewBox="0 0 600 ${H.toFixed(0)}" role="img" aria-label="Skjematisk kart over flysteder og værstasjoner">${g}${s}${m}</svg>`;
}

function windChart(stId, hours, { w = 680, h = 230 } = {}) {
  const data = OBS[stId].slice(-hours);
  const pad = { l: 34, r: 12, t: 34, b: 26 }; const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const ymax = Math.max(12, Math.ceil(Math.max(...data.map(o => o.gust)) / 2) * 2);
  const X = i => pad.l + i / (data.length - 1) * iw, Y = v => pad.t + ih - v / ymax * ih;
  let grid = ""; for (let v = 0; v <= ymax; v += ymax > 16 ? 4 : 2) grid += `<line class="g-line" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="t-muted" font-size="10" x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`;
  const step = hours <= 48 ? 6 : 24; let xl = "";
  data.forEach((o, i) => { if (o.t.getHours() % step === 0 && (step === 6 || true)) { xl += `<line class="g-line" x1="${X(i)}" x2="${X(i)}" y1="${pad.t}" y2="${pad.t + ih}"/><text class="t-muted" font-size="10" x="${X(i)}" y="${h - 8}" text-anchor="middle">${hours <= 48 ? String(o.t.getHours()).padStart(2, "0") : o.t.getDate() + "."}</text>`; } });
  const band = data.map((o, i) => `${X(i)},${Y(o.gust)}`).join(" ") + " " + data.map((o, i) => `${X(i)},${Y(o.sp)}`).reverse().join(" ");
  const line = data.map((o, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(o.sp).toFixed(1)}`).join("");
  const gl = data.map((o, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(o.gust).toFixed(1)}`).join("");
  const aStep = hours <= 48 ? 3 : hours <= 168 ? 12 : 24; let arrows = "";
  data.forEach((o, i) => { if (i % aStep === 0) arrows += `<g transform="translate(${X(i)},${pad.t - 16}) rotate(${(o.dir + 180).toFixed(0)})"><path d="M0,-7 L4,5 L0,2 L-4,5Z" style="fill:var(--fjord)"/></g>`; });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Vind siste ${hours} timer" style="width:100%;height:auto">
    ${grid}${xl}
    <line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(RULES.maxWind)}" y2="${Y(RULES.maxWind)}" style="stroke:var(--accent);stroke-dasharray:4 3;opacity:.7"/>
    <text font-size="10" x="${w - pad.r - 2}" y="${Y(RULES.maxWind) - 4}" text-anchor="end" style="fill:var(--accent)">7 m/s</text>
    <polygon points="${band}" style="fill:var(--possible);opacity:.45"/>
    <path d="${gl}" style="fill:none;stroke:var(--s2);stroke-width:1"/>
    <path d="${line}" style="fill:none;stroke:var(--fjord);stroke-width:2.2"/>
    ${arrows}
    <text class="t-muted" font-size="10" x="${pad.l}" y="10">Pilene viser hvor vinden blåser</text>
  </svg>`;
}

function windRose(stId, hours, site = null, size = 260) {
  const data = OBS[stId].slice(-hours); const bins = [2, 5, 8, 99];
  const cnt = DIRS.map(() => [0, 0, 0, 0]);
  for (const o of data) { const k = DIRS.indexOf(sectorOf(o.dir)); cnt[k][bins.findIndex(b => o.sp < b)]++; }
  const tot = data.length, maxF = Math.max(...cnt.map(c => c.reduce((a, b) => a + b, 0))) / tot;
  const c = size / 2, R = c - 26; let out = "";
  for (const f of [.25, .5, .75, 1]) out += `<circle cx="${c}" cy="${c}" r="${R * f}" class="g-line" style="fill:none"/>`;
  if (site) DIRS.forEach((d, k) => { const t = site.d.includes(d) ? "var(--dir-primary)" : site.p.includes(d) ? "var(--possible)" : null; if (t) { const a0 = (k * 45 - 22.5 - 90) * Math.PI / 180, a1 = (k * 45 + 22.5 - 90) * Math.PI / 180; out += `<path d="M${c + Math.cos(a0) * (R + 6)},${c + Math.sin(a0) * (R + 6)} A${R + 6},${R + 6} 0 0 1 ${c + Math.cos(a1) * (R + 6)},${c + Math.sin(a1) * (R + 6)}" style="fill:none;stroke:${t};stroke-width:6"/>`; } });
  const cols = ["var(--s0)", "var(--s1)", "var(--s2)", "var(--s4)"];
  cnt.forEach((cc, k) => { let acc = 0; cc.forEach((v, b) => { const r0 = acc / tot / maxF * R, r1 = (acc + v) / tot / maxF * R; acc += v; if (v === 0) return; const a0 = (k * 45 - 19 - 90) * Math.PI / 180, a1 = (k * 45 + 19 - 90) * Math.PI / 180;
    out += `<path d="M${c + Math.cos(a0) * r0},${c + Math.sin(a0) * r0} L${c + Math.cos(a0) * r1},${c + Math.sin(a0) * r1} A${r1},${r1} 0 0 1 ${c + Math.cos(a1) * r1},${c + Math.sin(a1) * r1} L${c + Math.cos(a1) * r0},${c + Math.sin(a1) * r0} A${r0},${r0} 0 0 0 ${c + Math.cos(a0) * r0},${c + Math.sin(a0) * r0}Z" style="fill:${cols[b]};stroke:var(--card);stroke-width:.8"/>`; }); });
  DIRS.forEach((d, k) => { const a = (k * 45 - 90) * Math.PI / 180; out += `<text class="t-ink t-head" font-size="12" x="${c + Math.cos(a) * (R + 17)}" y="${c + Math.sin(a) * (R + 17) + 4}" text-anchor="middle">${DIR_NO[d]}</text>`; });
  const legend = `<div class="hm-scale"><i style="background:var(--s0)"></i>under 2 <i style="background:var(--s1)"></i>2–5 <i style="background:var(--s2)"></i>5–8 <i style="background:var(--s4)"></i>over 8 m/s${site ? ` <span style="margin-left:8px"><i style="background:var(--dir-primary)"></i> startens retninger</span>` : ""}</div>`;
  return `<div style="display:grid;gap:8px;justify-items:center"><svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto" role="img" aria-label="Vindrose">${out}</svg>${legend}</div>`;
}

function heatmap(site) {
  // Andel timer (eksempel) der stasjonen ved starten har vist vind som kan passe, per måned og time.
  const r = rng(site.id.length * 97 + site.d.length * 13); const dirF = Math.min(1, (site.d.length + site.p.length * .4) / 5);
  let html = `<div class="hm" role="table" aria-label="Flybare timer per måned og time"><span class="lab"></span>`;
  for (let h = 6; h <= 22; h++) html += `<span class="hl">${h % 2 === 0 ? h : ""}</span>`;
  for (let m = 0; m < 12; m++) {
    html += `<span class="lab">${MONTHS[m]}</span>`;
    const season = .45 + .5 * Math.cos((m - 6) / 12 * Math.PI * 2);
    const light = m >= 10 || m <= 1 ? .25 : 1;
    for (let h = 6; h <= 22; h++) {
      const dayShape = Math.exp(-Math.pow((h - 14) / 4.2, 2));
      let v = season * dayShape * dirF * light * (.75 + r() * .5);
      if ((m === 11 || m === 0) && (h < 10 || h > 14)) v *= .1;
      const lvl = v < .06 ? 0 : v < .14 ? 1 : v < .24 ? 2 : v < .34 ? 3 : 4;
      const col = ["var(--surface)", "var(--s0)", "var(--s1)", "var(--s2)", "var(--s3)"][lvl];
      html += `<div title="${MONTHS[m]} kl. ${h}: ${Math.round(v * 100)} %" style="background:${col}"></div>`;
    }
  }
  return html + `</div><div class="hm-scale">Andel timer som kunne passet: <i style="background:var(--surface)"></i>under 6 % <i style="background:var(--s0)"></i> <i style="background:var(--s1)"></i> <i style="background:var(--s2)"></i> <i style="background:var(--s3)"></i>over 34 %</div>`;
}

const V = {};

      <div style="min-width:0"><b>${esc(st.name)}</b> <span class="muted small">${st.alt} moh</span><div class="small muted">${esc(st.src)} · ${DIR_WORD[sectorOf(o.dir)]} · ${st.kind === "forslag" ? "foreslått stasjon" : "oppdatert 14:00"}</div></div>
      <div class="big">${fmt(o.sp)}<br><small>kast ${fmt(o.gust)}</small></div></a>`; }).join("");

    <div class="head"><span class="eyebrow">Forsiden, ny versjon</span><h1>Starter og værstasjoner i samme kart</h1>

        <p class="small muted">Kartet er skjematisk i prototypen. På den ekte siden ligger det oppå Kartverkets kart, med samme vindroser og filtre som i dag.</p>
      </div>
      <div class="card"><header><h2>Målt vind nå</h2><span class="muted small num">søndag 5. okt kl. 14:00</span></header>

};

V.vaer = () => V.kart().replace("Forsiden, ny versjon", "Værstasjoner").replace("Starter og værstasjoner i samme kart", "Alle værstasjoner i området");

V.stasjon = (id, state) => {
  const st = ST[id] || STATIONS[0]; const o = latest(st.id); const span = state.span || 48;
  const near = nearestSites(st).slice(0, 8);
  const nearRows = near.map(({ s, km }) => { const a = assess(s, o); const fh = flyableHours(s, st.id);
    return `<tr class="click" data-go="sted-${s.id}"><td><a href="#sted-${s.id}">${esc(s.name)}</a><div class="tags" style="margin-top:3px">${s.d.map(d => `<span class="tag primary">${DIR_NO[d]}</span>`).join("")}${s.p.map(d => `<span class="tag possible">${DIR_NO[d]}</span>`).join("")}</div></td>
      <td class="r num">${fmt(km)} km</td><td class="r num">${s.alt != null ? (s.alt - st.alt > 0 ? "+" : "") + (s.alt - st.alt) + " m" : "–"}</td>
      <td><span class="tag ${a.cls}">${a.label}</span></td><td class="r num"><b>${fh}</b> t</td></tr>`; }).join("");
  const tbl = OBS[st.id].slice(-12).reverse().map(x => `<tr><td class="num">${String(x.t.getHours()).padStart(2, "0")}:00</td><td>${DIR_NO[sectorOf(x.dir)]} <span class="muted num">${Math.round(x.dir)}°</span></td><td class="r num">${fmt(x.sp)}</td><td class="r num">${fmt(x.gust)}</td><td class="r num">${fmt(x.temp)}°</td></tr>`).join("");
  return `<section class="view">
    <div class="crumb"><a href="#vaer">← Alle værstasjoner</a></div>
    <div class="head"><span class="eyebrow">${esc(st.src)}${st.kind === "forslag" ? " · foreslått" : ""}</span><h1>${esc(st.name)}</h1>
      <p class="lead">${st.alt} moh. Målinger hvert 10. minutt i ekte drift, her vist som timeverdier. Historikken lagres, så du kan se hvordan det har blåst før du kjører ut.</p></div>
    <div class="grid2">
      <div style="display:grid;gap:24px;min-width:0">
        <div class="card"><header><h2>Vind</h2><div class="seg" role="group" aria-label="Periode">${[[24, "24 t"], [48, "48 t"], [168, "7 d"], [720, "30 d"]].map(([v, l]) => `<button data-span="${v}" aria-pressed="${v === span}">${l}</button>`).join("")}</div></header>
          ${windChart(st.id, span)}
          <div class="hm-scale"><i style="background:var(--fjord);height:3px"></i>middelvind <i style="background:var(--possible)"></i>opp til kast</div>

/* Logg */
function trackFor(f) {
  const site = SITE[f.site]; const r = rng(f.id.split("").reduce((a, c) => a + c.charCodeAt(0), 0));
  const pts = []; let lat = site.lat, lon = site.lon; const n = 60; const bearing = (DIRS.indexOf(site.d[0]) * 45 + 180) * Math.PI / 180;
  for (let i = 0; i < n; i++) { const stepKm = f.km / n * (f.xc ? 1.1 : .6); lat += Math.cos(bearing + (r() - .5) * 1.8) * stepKm / 111; lon += Math.sin(bearing + (r() - .5) * 1.8) * stepKm / (111 * Math.cos(lat * Math.PI / 180)); if (!f.xc && i > n / 2) { lat -= Math.cos(bearing) * stepKm / 111 * .9; } pts.push([lat, lon]); }
  return pts;
}
function trackSVG(pts, site) {
  const lats = pts.map(p => p[0]).concat(site.lat), lons = pts.map(p => p[1]).concat(site.lon);
  const k = Math.cos(68.75 * Math.PI / 180); const minLa = Math.min(...lats), maxLa = Math.max(...lats), minLo = Math.min(...lons), maxLo = Math.max(...lons);
  const w = 420, h = 260, padd = 24; const sx = (w - 2 * padd) / Math.max(1e-4, (maxLo - minLo) * k), sy = (h - 2 * padd) / Math.max(1e-4, maxLa - minLa); const s = Math.min(sx, sy);
  const X = lo => padd + (lo - minLo) * k * s + ((w - 2 * padd) - (maxLo - minLo) * k * s) / 2, Y = la => padd + (maxLa - la) * s + ((h - 2 * padd) - (maxLa - minLa) * s) / 2;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join("");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;background:var(--map-bg);border-radius:10px" role="img" aria-label="Flyspor">
    <path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round"/>
    <circle cx="${X(site.lon)}" cy="${Y(site.lat)}" r="6" style="fill:var(--dir-primary);stroke:var(--card);stroke-width:2"/>
    <text class="st-name" x="${X(site.lon) + 9}" y="${Y(site.lat) + 4}">${esc(site.name)}</text>
    <circle cx="${X(last[1])}" cy="${Y(last[0])}" r="5" style="fill:var(--text)"/>
    <text class="st-name" x="${X(last[1]) + 8}" y="${Y(last[0]) + 4}">Landet</text></svg>`;
}
let uploaded = null;
function parseIGC(text) {
  const fixes = []; let date = null;
  for (const line of text.split(/\r?\n/)) {
    const dm = /^HFDTE(?:DATE:)?(\d{2})(\d{2})(\d{2})/.exec(line); if (dm) date = new Date(2000 + +dm[3], +dm[2] - 1, +dm[1]);
    const b = /^B(\d{2})(\d{2})(\d{2})(\d{2})(\d{5})([NS])(\d{3})(\d{5})([EW])[AV](\d{5}|-\d{4})(\d{5})/.exec(line);
    if (b) { let lat = +b[4] + +b[5] / 60000, lon = +b[7] + +b[8] / 60000; if (b[6] === "S") lat = -lat; if (b[9] === "W") lon = -lon; fixes.push({ s: +b[1] * 3600 + +b[2] * 60 + +b[3], lat, lon, alt: +b[11] || +b[10] }); }
  }
  if (fixes.length < 5) return null;
  const start = fixes[0]; let far = 0, track = 0;
  fixes.forEach((f, i) => { far = Math.max(far, distKm(start, f)); if (i) track += distKm(fixes[i - 1], f); });
  const near = SITES.map(s => ({ s, km: distKm(start, s) })).sort((a, b) => a.km - b.km)[0];
  return { date, fixes, min: (fixes[fixes.length - 1].s - start.s) / 60, km: far, track, maxAlt: Math.max(...fixes.map(f => f.alt)), site: near.km < 3 ? near.s : null, siteKm: near.km, nearSite: near.s };
}

  const byPilot = {}; fl.forEach(f => { const p = byPilot[f.pilot] ||= { n: 0, min: 0, km: 0, sites: new Set() }; p.n++; p.min += f.min; p.km = Math.max(p.km, f.km); p.sites.add(f.site); });

/* ---------- Ruting ---------- */
const state = {};
function render() {
  const hash = location.hash.slice(1) || "kart";
  const [view, ...rest] = hash.split("-"); const arg = rest.join("-");
  const fn = V[view] || V.kart; document.getElementById("app").innerHTML = fn(arg, state);
  const navKey = view === "stasjon" ? "vaer" : view;
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href").slice(1).split("-")[0] === navKey ? "page" : "false"));
  bind();
}
function bind() {
  const app = document.getElementById("app");
  app.querySelectorAll("[data-go]").forEach(el => { const go = () => { location.hash = el.dataset.go; }; el.addEventListener("click", e => { if (e.target.closest("a")) return; go(); }); el.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
  app.querySelectorAll("[data-span]").forEach(b => b.addEventListener("click", () => { state.span = +b.dataset.span; render(); }));
  app.querySelectorAll("[data-year]").forEach(b => b.addEventListener("click", () => { state.year = b.dataset.year === "alle" ? "alle" : +b.dataset.year; render(); }));
  app.querySelectorAll("[data-flight]").forEach(b => b.addEventListener("click", () => { state.flight = b.dataset.flight; render(); }));
  const drop = document.getElementById("drop"), input = document.getElementById("igc");
  if (drop) {
    const read = file => { if (!file) return; const fr = new FileReader(); fr.onload = () => { const r = parseIGC(String(fr.result)); uploaded = r ? { ...r, name: file.name } : { error: "Fant ingen flypunkter i filen. Er det en IGC-fil fra et variometer eller en app?" }; render(); }; fr.readAsText(file); };
    input.addEventListener("change", () => read(input.files[0]));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); read(e.dataTransfer.files[0]); });
  }
  const form = document.getElementById("manual");
  if (form) form.addEventListener("submit", e => { e.preventDefault(); document.getElementById("m-msg").textContent = "Lagret (bare i prototypen, ingenting sendes)."; });
}
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#stasjon")) state.span = 48; render(); window.scrollTo(0, 0); });
render();
